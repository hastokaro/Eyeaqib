name: Build EyReqibIntro Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o /tmp/sdks.tar.gz
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          mv /tmp/sdks-master/* $HOME/theos/sdks/

      - name: Build Dylib
        env:
          THEOS: ${{ runner.env.HOME }}/theos
        run: |
          make package FINALPACKAGE=1

      - name: Upload EyReqibIntro.dylib
        uses: actions/upload-artifact@v4
        with:
          name: EyReqibIntro-dylib
          path: .theos/obj/EyReqibIntro.dylib
