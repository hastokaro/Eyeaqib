name: Build EyReqibIntro Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          mkdir -p $HOME/theos/sdks
          curl -L https://github.com/xybp888/iOS-SDKs/releases/download/iOS-SDKs/iPhoneOS16.5.sdk.tar.xz | tar -xJ -C $HOME/theos/sdks

      - name: Build Dylib
        env:
          THEOS: ${{ runner.env.HOME }}/theos
        run: |
          make package FINALPACKAGE=1

      - name: Upload EyReqibIntro.dylib
        uses: actions/upload-artifact@v4
        with:
          name: EyReqibIntro-dylib
          path: .theos/obj/EyReqibIntro.dylib
